version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisgate-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_password
      POSTGRES_DB: aegisgate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: aegisgate-redis
    ports:
      - "6379:6379"
volumes:
  pgdata:
